<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Søgning | Nybrogård Kollegiet</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  
</head>

<body>
  <main class="section-padding">
    <div class="container">
      <section class="search-hero">
        <p class="eyebrow">Søg på Nybrogård Kollegiet</p>
        <h1>Hvad leder du efter?</h1>
        <p class="lead">
          Find hurtigt information om bolig, vaskeri, internet, klubber, regler og kontakt.
        </p>

        <form class="search-page-form" action="search.html" method="get" role="search">
          <label class="visually-hidden" for="searchInput">Søg på siden</label>

          <input
            class="search-page-input"
            type="search"
            id="searchInput"
            name="q"
            placeholder="Skriv f.eks. vaskeri, internet eller ansøgning"
            autocomplete="off"
          >

          <button class="search-page-btn" type="submit">
            Søg
          </button>
        </form>
      </section>

      <section class="search-results-section">
        <div class="search-results-header">
          <h2 id="searchTitle">Søgeresultater</h2>
          <p id="searchCount"></p>
        </div>

        <div id="searchResults" class="search-results-grid"></div>
      </section>
    </div>
  </main>

  <script src="js/search.js"></script>
</body>
</html>
